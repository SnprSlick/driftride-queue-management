<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Dashboard - Drift Car Queue System</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- SignalR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.0/signalr.min.js"></script>

    <style>
        /* High-tech grid overlay background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            pointer-events: none;
            z-index: 1;
        }

        .driver-dashboard {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            padding-bottom: 2rem;
            position: relative;
            z-index: 2;
        }

        .driver-header {
            background: rgba(0, 0, 0, 0.6);
            border-bottom: 2px solid #00d4ff;
            backdrop-filter: blur(10px);
            padding: 1rem 0;
            margin-bottom: 2rem;
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.1);
        }

        .dashboard-title {
            color: #ffffff;
            font-weight: 600;
            margin: 0;
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .connection-status {
            color: #e0e0e0;
            font-family: 'Courier New', monospace;
        }

        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 3px;
            font-weight: 500;
            clip-path: polygon(8px 0%, 100% 0%, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0% 100%, 0% 8px);
            border: 1px solid transparent;
        }

        .status-indicator.connected {
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
            border-color: #00ff88;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
        }

        .status-indicator.connecting {
            background: rgba(255, 193, 7, 0.2);
            color: #ffc107;
            border-color: #ffc107;
            box-shadow: 0 0 10px rgba(255, 193, 7, 0.3);
        }

        .status-indicator.disconnected {
            background: rgba(220, 53, 69, 0.2);
            color: #dc3545;
            border-color: #dc3545;
            box-shadow: 0 0 10px rgba(220, 53, 69, 0.3);
        }

        .current-customer-card {
            min-height: 400px;
        }

        .current-customer-display {
            text-align: center;
            padding: 2rem;
        }

        .customer-name-large {
            font-size: 2.5rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 1rem;
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.6);
        }

        .customer-details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin: 2rem 0;
        }

        .detail-item {
            text-align: center;
            padding: 1.5rem 1rem;
            background: #2a2a2a;
            border: 2px solid #404040;
            border-radius: 3px;
            clip-path: polygon(15px 0%, 100% 0%, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0% 100%, 0% 15px);
            transition: all 0.3s ease;
            box-shadow:
                0 10px 30px rgba(0,0,0,0.3),
                0 0 15px rgba(0, 212, 255, 0.1),
                inset 0 0 20px rgba(0, 212, 255, 0.02);
        }

        .detail-item:hover {
            border-color: #00d4ff;
            transform: translateY(-2px);
            box-shadow:
                0 15px 40px rgba(0,0,0,0.4),
                0 0 25px rgba(0, 212, 255, 0.3),
                inset 0 0 30px rgba(0, 212, 255, 0.05);
        }

        .detail-label {
            font-size: 0.875rem;
            color: #b0b0b0;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.75rem;
            font-weight: 600;
            font-family: 'Courier New', monospace;
        }

        .detail-value {
            font-size: 1.25rem;
            font-weight: 600;
            color: #ffffff;
            line-height: 1.3;
            font-family: 'Courier New', monospace;
        }

        .complete-ride-btn {
            background: linear-gradient(45deg, #00ff88, #00cc6a);
            border: 2px solid #00ff88;
            font-size: 1.5rem;
            padding: 1.25rem 2rem;
            border-radius: 3px;
            clip-path: polygon(15px 0%, 100% 0%, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0% 100%, 0% 15px);
            box-shadow:
                0 8px 25px rgba(0, 255, 136, 0.4),
                0 0 20px rgba(0, 255, 136, 0.2);
            transition: all 0.3s ease;
            color: #000000;
            font-weight: 600;
            letter-spacing: 1px;
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }

        .complete-ride-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: -100%;
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.8);
            transition: left 0.5s ease;
            z-index: 1;
        }

        .complete-ride-btn:hover::before {
            left: 100%;
        }

        .complete-ride-btn:hover {
            transform: translateY(-3px);
            box-shadow:
                0 15px 40px rgba(0, 255, 136, 0.6),
                0 0 30px rgba(0, 255, 136, 0.4);
            background: linear-gradient(45deg, #00e67a, #00b359);
            color: #000000;
        }

        .complete-ride-btn:active {
            transform: translateY(-1px);
        }

        .complete-ride-btn:focus {
            box-shadow: 0 0 0 3px rgba(0, 255, 136, 0.4);
            color: #000000;
        }

        .keyboard-hint kbd {
            background: #404040;
            border: 1px solid #606060;
            border-radius: 3px;
            padding: 0.25rem 0.5rem;
            font-size: 0.875rem;
            color: #00d4ff;
            font-family: 'Courier New', monospace;
            box-shadow: 0 0 5px rgba(0, 212, 255, 0.3);
        }

        .action-section {
            padding-top: 2rem;
            border-top: 2px solid #404040;
        }

        .queue-stats .stat-item {
            text-align: center;
            padding: 1rem 0;
        }

        .stat-number {
            font-size: 3rem;
            font-weight: 700;
            color: #00d4ff;
            font-family: 'Courier New', monospace;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.6);
        }

        .stat-description {
            color: #b0b0b0;
            font-size: 0.875rem;
            text-transform: uppercase;
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
        }

        .upcoming-customer-item {
            padding: 1rem;
            border-bottom: 1px solid #404040;
            transition: all 0.3s ease;
            background: rgba(42, 42, 42, 0.5);
        }

        .upcoming-customer-item:hover {
            background: rgba(0, 212, 255, 0.1);
            border-left: 3px solid #00d4ff;
            padding-left: 0.75rem;
        }

        .upcoming-customer-item:last-child {
            border-bottom: none;
        }

        .customer-name {
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 0.5rem;
            font-family: 'Courier New', monospace;
        }

        .customer-details {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .position-badge {
            background: #404040;
            color: #00d4ff;
            padding: 0.25rem 0.5rem;
            border-radius: 3px;
            font-size: 0.75rem;
            font-weight: 600;
            font-family: 'Courier New', monospace;
            border: 1px solid #00d4ff;
            clip-path: polygon(5px 0%, 100% 0%, 100% calc(100% - 5px), calc(100% - 5px) 100%, 0% 100%, 0% 5px);
        }

        .wait-time {
            font-size: 0.875rem;
            color: #b0b0b0;
            font-family: 'Courier New', monospace;
        }

        .wait-time.long-wait {
            color: #ff6b6b;
            font-weight: 600;
            text-shadow: 0 0 10px rgba(255, 107, 107, 0.5);
        }

        .disambiguation-time {
            font-size: 1rem;
            color: #b0b0b0;
            font-style: italic;
            font-family: 'Courier New', monospace;
        }

        .text-warning {
            color: #ffc107 !important;
            text-shadow: 0 0 10px rgba(255, 193, 7, 0.5);
        }

        .text-danger {
            color: #ff6b6b !important;
            text-shadow: 0 0 10px rgba(255, 107, 107, 0.5);
        }

        .no-customers {
            color: #b0b0b0;
            font-family: 'Courier New', monospace;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .customer-name-large {
                font-size: 2rem;
            }

            .customer-details-grid {
                grid-template-columns: 1fr 1fr;
                gap: 0.75rem;
            }

            .detail-item {
                padding: 1rem 0.75rem;
            }

            .detail-value {
                font-size: 1.1rem;
            }

            .complete-ride-btn {
                font-size: 1.25rem;
                padding: 1rem 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .customer-details-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Completion animation */
        @keyframes completionPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .completion-success {
            animation: completionPulse 0.6s ease-in-out;
        }

        .session-stats {
            text-align: center;
            padding: 1rem;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: #00ff88;
            font-family: 'Courier New', monospace;
            text-shadow: 0 0 15px rgba(0, 255, 136, 0.6);
        }

        .stat-label {
            font-size: 0.875rem;
            color: #b0b0b0;
            text-transform: uppercase;
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
        }

        /* Angular card styling */
        .angular-card {
            background: #2a2a2a !important;
            border: 2px solid #404040 !important;
            border-radius: 3px !important;
            clip-path: polygon(20px 0%, 100% 0%, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0% 100%, 0% 20px);
            box-shadow:
                0 15px 35px rgba(0,0,0,0.3),
                0 0 20px rgba(0, 212, 255, 0.1),
                inset 0 0 25px rgba(0, 212, 255, 0.02) !important;
        }

        .angular-card .card-header {
            background: linear-gradient(135deg, #404040, #2a2a2a) !important;
            border-bottom: 2px solid #00d4ff !important;
            color: #ffffff !important;
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .angular-card .card-body {
            background: transparent !important;
        }

        /* Compact button styling */
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 2px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn-success {
            background: #48bb78;
            color: white;
        }

        .btn-success:hover {
            background: #38a169;
        }

        .btn-outline-primary {
            background: transparent;
            border: 1px solid #00d4ff;
            color: #00d4ff;
        }

        .btn-outline-primary:hover {
            background: rgba(0, 212, 255, 0.1);
            color: #ffffff;
        }

        .btn-outline-warning {
            background: transparent;
            border: 1px solid #ffc107;
            color: #ffc107;
        }

        .btn-outline-warning:hover {
            background: rgba(255, 193, 7, 0.1);
            color: #ffffff;
        }

        /* Mobile-optimized button styles */
        .mobile-thumb-button {
            min-height: 60px !important;
            font-size: 1.2rem !important;
            font-weight: 600 !important;
            border-radius: 12px !important;
            padding: 16px 24px !important;
            margin: 8px 0 !important;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .quick-actions-buttons {
            gap: 16px !important;
        }

        .quick-actions-buttons .btn {
            min-height: 48px;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        /* Complete Ride button prominent styling */
        #completeRideBtn {
            background: linear-gradient(135deg, #28a745, #1e7e34) !important;
            border: none !important;
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.4) !important;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2) !important;
            transform: translateZ(0);
            transition: all 0.2s ease !important;
        }

        #completeRideBtn:hover, #completeRideBtn:active {
            transform: translateY(-1px) !important;
            box-shadow: 0 6px 16px rgba(40, 167, 69, 0.5) !important;
            background: linear-gradient(135deg, #218838, #1a6e2e) !important;
        }

        /* Mobile responsive adjustments */
        @media (max-width: 768px) {
            .quick-actions-buttons .d-flex {
                flex-direction: column !important;
                gap: 12px !important;
            }

            .quick-actions-buttons .btn {
                width: 100% !important;
                margin: 0 !important;
            }

            #completeRideBtn {
                order: -1;
                margin-bottom: 20px !important;
            }

            .mobile-thumb-button {
                min-height: 70px !important;
                font-size: 1.3rem !important;
            }
        }
    </style>
</head>
<body>
    <div class="driver-dashboard">
        <!-- Header with Status -->

        <div class="container-fluid pt-3">
            <div class="row">
                <!-- Current Customer Card -->
                <div class="col-12">
                    <div class="current-customer-card">
                        <div class="card border-0 shadow-sm angular-card">
                            <div class="card-header">
                                <h5 class="mb-0">Current Customer</h5>
                            </div>
                            <div class="card-body p-4">
                                <div id="currentCustomerContent">
                                    <!-- Current customer will be loaded here -->
                                </div>
                            </div>
                        </div>
                    </div>

                </div>

            <!-- Queue Preview Section -->
            <div class="row mt-2">
                <div class="col-12">
                    <div class="card border-0 shadow-sm angular-card">
                        <div class="card-header">
                            <h5 class="mb-0">Next Customers</h5>
                        </div>
                        <div class="card-body p-0">
                            <div id="upcomingCustomers" class="upcoming-list">
                                <!-- Upcoming customers will be loaded here -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Statistics Table -->
            <div class="row mt-4">
                <div class="col-12">
                    <div class="card border-0 shadow-sm angular-card">
                        <div class="card-header">
                            <h5 class="mb-0">Statistics</h5>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-dark table-striped">
                                    <tbody>
                                        <tr>
                                            <td><strong>Customers Waiting</strong></td>
                                            <td><span id="queueLength" class="text-info">4</span></td>
                                        </tr>
                                        <tr>
                                            <td><strong>Rides Completed Today</strong></td>
                                            <td><span id="ridesCompleted" class="text-success">12</span></td>
                                        </tr>
                                        <tr>
                                            <td><strong>Connection Status</strong></td>
                                            <td><span id="connectionStatusText" class="text-success">Connected</span></td>
                                        </tr>
                                        <tr>
                                            <td><strong>Last Updated</strong></td>
                                            <td><span id="lastUpdated" class="text-primary">Just now</span></td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                            <!-- Secondary Actions -->
                            <div class="quick-actions-buttons mt-3">
                                <div class="d-flex gap-2 justify-content-center">
                                    <button id="refreshBtn" class="btn btn-outline-primary flex-fill">
                                        <i class="fas fa-sync-alt"></i> Refresh
                                    </button>
                                    <button id="emergencyBtn" class="btn btn-outline-warning flex-fill">
                                        <i class="fas fa-exclamation-triangle"></i> Need Help
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Completion Confirmation Modal -->
    <div class="modal fade" id="completionModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title">
                        <i class="fas fa-check-circle"></i>
                        Ride Completed
                    </h5>
                </div>
                <div class="modal-body text-center">
                    <div class="completion-success">
                        <i class="fas fa-check-circle fa-4x text-success mb-3"></i>
                        <h4 id="completedCustomerName">Ride completed successfully!</h4>
                        <p class="text-muted">Moving to next customer...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // API Configuration
        const API_BASE = 'http://localhost:3001/api';

        // State variables
        let currentCustomer = null;
        let queueData = [];
        let ridesCompleted = 0;
        let connectionStatus = 'connected';

        class DriverDashboardDemo {
            constructor() {
                this.handleKeyPress = this.handleKeyPress.bind(this);
                this.completeCurrentRide = this.completeCurrentRide.bind(this);
                this.refreshDashboard = this.refreshDashboard.bind(this);
            }

            async initialize() {
                console.log('Initializing Driver Dashboard...');

                this.setupEventListeners();
                this.setupKeyboardShortcuts();
                this.setupEventBroadcasting();
                await this.loadDashboardData();
                this.updateLastUpdated();
                this.startAutoRefresh();

                console.log('Driver Dashboard initialized successfully');
            }

            setupEventListeners() {
                document.addEventListener('click', (e) => {
                    if (e.target.id === 'completeCurrentRideBtn' || e.target.closest('#completeCurrentRideBtn')) {
                        e.preventDefault();
                        this.completeCurrentRide();
                    }
                });

                const refreshBtn = document.getElementById('refreshBtn');
                if (refreshBtn) {
                    refreshBtn.addEventListener('click', () => this.refreshDashboard());
                }

                const emergencyBtn = document.getElementById('emergencyBtn');
                if (emergencyBtn) {
                    emergencyBtn.addEventListener('click', () => this.handleEmergency());
                }
            }

            setupKeyboardShortcuts() {
                document.addEventListener('keydown', this.handleKeyPress);
            }

            handleKeyPress(event) {
                if (event.target.tagName === 'INPUT' || event.target.tagName === 'TEXTAREA') {
                    return;
                }

                switch (event.key) {
                    case ' ':
                    case 'Enter':
                        event.preventDefault();
                        this.completeCurrentRide();
                        break;
                    case 'F5':
                        event.preventDefault();
                        this.refreshDashboard();
                        break;
                    case 'F1':
                        event.preventDefault();
                        this.handleEmergency();
                        break;
                    case 'Escape':
                        event.preventDefault();
                        this.clearNotifications();
                        break;
                }
            }

            async loadDashboardData() {
                try {
                    await Promise.all([
                        this.loadCurrentCustomer(),
                        this.loadQueueData(),
                        this.loadStats()
                    ]);
                    this.updateConnectionStatus('connected');
                } catch (error) {
                    console.error('Error loading dashboard data:', error);
                    this.updateConnectionStatus('disconnected');
                }
            }

            async loadCurrentCustomer() {
                const container = document.getElementById('currentCustomerContent');
                if (!container) return;

                try {
                    const response = await fetch(`${API_BASE}/queue/current`);

                    if (response.status === 204) {
                        // No current customer
                        currentCustomer = null;
                        this.showNoCustomer();
                        this.updateCompleteButton(false);
                        return;
                    }

                    const result = await response.json();
                    if (result.success) {
                        currentCustomer = result.data;
                        const customerHtml = this.buildCurrentCustomerHtml(currentCustomer);
                        container.innerHTML = customerHtml;
                        this.updateCompleteButton(true);
                    } else {
                        throw new Error(result.message || 'Failed to load current customer');
                    }
                } catch (error) {
                    console.error('Error loading current customer:', error);
                    currentCustomer = null;
                    this.showNoCustomer();
                    this.updateCompleteButton(false);
                    this.showNotification('Failed to load current customer', 'error');
                }
            }

            buildCurrentCustomerHtml(customer) {
                const waitTime = this.calculateWaitTime(customer.queuedAt);
                const isLongWait = waitTime.totalMinutes > 10;
                const isVeryLongWait = waitTime.totalMinutes > 20;

                // Extract data from API response structure
                const customerData = customer.customer;
                const paymentData = customer.payment;
                const queuedTime = new Date(customer.queuedAt);
                const arrivalTimeDisplay = queuedTime.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

                return `
                    <div class="current-customer-display" data-queue-entry-id="${customer.id}">
                        <div class="customer-name-section">
                            <h2 class="customer-name-large">${customerData.name}</h2>
                        </div>



                        <div class="action-section mt-4">
                            <button id="completeCurrentRideBtn"
                                    class="btn complete-ride-btn btn-lg w-100 mobile-thumb-button"
                                    data-queue-entry-id="${customer.id}"
                                    data-customer-name="${customerData.name}">
                                <i class="fas fa-check-circle"></i>
                                Complete Ride for ${customerData.name}
                            </button>

                        </div>
                    </div>
                `;
            }

            showNoCustomer() {
                const container = document.getElementById('currentCustomerContent');
                if (container) {
                    container.innerHTML = `
                        <div class="no-customers text-center py-5">
                            <i class="fas fa-hourglass-end fa-3x text-muted mb-3"></i>
                            <h5 class="text-muted">No customers in queue</h5>
                            <p class="text-muted">Waiting for customers to join the queue...</p>
                        </div>
                    `;
                }
            }

            async loadQueueData() {
                try {
                    const response = await fetch(`${API_BASE}/queue`);
                    const result = await response.json();

                    if (result.success) {
                        queueData = result.data || [];
                        this.renderUpcomingCustomers();
                    } else {
                        throw new Error(result.message || 'Failed to load queue data');
                    }
                } catch (error) {
                    console.error('Error loading queue data:', error);
                    queueData = [];
                    this.renderUpcomingCustomers();
                    this.showNotification('Failed to load queue data', 'error');
                }
            }

            renderUpcomingCustomers() {
                const container = document.getElementById('upcomingCustomers');
                if (!container) return;

                // Get waiting customers, sorted by position
                const waitingCustomers = queueData
                    .filter(customer => customer.status === 'Waiting')
                    .sort((a, b) => a.position - b.position)
                    .slice(0, 3); // Show next 3 customers

                if (waitingCustomers.length > 0) {
                    container.innerHTML = waitingCustomers
                        .map(customer => this.buildUpcomingCustomerHtml(customer))
                        .join('');
                } else {
                    container.innerHTML = `
                        <div class="no-upcoming text-center p-3">
                            <i class="fas fa-inbox text-muted"></i>
                            <p class="text-muted mb-0">No upcoming customers</p>
                        </div>
                    `;
                }

                // Update queue length
                const queueLengthEl = document.getElementById('queueLength');
                if (queueLengthEl) {
                    queueLengthEl.textContent = waitingCustomers.length;
                }
            }

            buildUpcomingCustomerHtml(customer) {
                // Extract data from API response structure
                const customerData = customer.customer;

                return `
                    <div class="upcoming-customer-item">
                        <div class="customer-info">
                            <div class="customer-name">
                                ${customer.position}. ${customerData.name}
                            </div>
                        </div>
                    </div>
                `;
            }

            calculateWaitTime(queuedAt) {
                const now = new Date();
                const queued = new Date(queuedAt);
                const diffMs = now - queued;
                const diffMinutes = Math.floor(diffMs / 60000);

                let display;
                if (diffMinutes < 1) {
                    display = "< 1 min";
                } else if (diffMinutes < 60) {
                    display = `${diffMinutes} min`;
                } else {
                    const hours = Math.floor(diffMinutes / 60);
                    const mins = diffMinutes % 60;
                    display = `${hours}h ${mins}m`;
                }

                return {
                    totalMinutes: diffMinutes,
                    display: display
                };
            }

            updateCompleteButton(enabled) {
                const btn = document.getElementById('completeRideBtn');
                if (btn) {
                    btn.disabled = !enabled;
                }

                const currentBtn = document.getElementById('completeCurrentRideBtn');
                if (currentBtn) {
                    currentBtn.disabled = !enabled;
                }
            }

            async completeCurrentRide() {
                if (!currentCustomer) {
                    this.showNotification('No customer to complete', 'error');
                    return;
                }

                const completeBtn = document.getElementById('completeCurrentRideBtn');

                if (completeBtn) {
                    completeBtn.disabled = true;
                    completeBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Completing...';
                }

                try {
                    const response = await fetch(`${API_BASE}/queue/${currentCustomer.id}/complete`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            completedBy: 'driver@example.com',
                            reason: 'Ride completed successfully',
                            notes: 'Driver completed ride via dashboard'
                        })
                    });

                    const result = await response.json();

                    if (result.success) {
                        ridesCompleted++;

                        // Update rides completed counter
                        const ridesCompletedEl = document.getElementById('ridesCompleted');
                        if (ridesCompletedEl) {
                            ridesCompletedEl.textContent = ridesCompleted;
                        }

                        // Show completion modal
                        this.showCompletionModal(currentCustomer.customer.name);

                        // Broadcast event for real-time updates
                        this.broadcastEvent('ride_completed', {
                            customer: currentCustomer,
                            completedBy: 'driver@example.com',
                            timestamp: new Date().toISOString()
                        });

                        this.showNotification('Ride completed successfully!', 'success');

                        // Auto-refresh to get next customer after short delay
                        setTimeout(async () => {
                            await this.loadDashboardData();
                            this.updateLastUpdated();
                        }, 1500);

                    } else {
                        throw new Error(result.message || 'Failed to complete ride');
                    }
                } catch (error) {
                    console.error('Error completing ride:', error);
                    this.showNotification('Failed to complete ride: ' + error.message, 'error');

                    // Re-enable button on error
                    if (completeBtn) {
                        completeBtn.disabled = false;
                        completeBtn.innerHTML = '<i class="fas fa-check-circle"></i> Complete Ride for ' + currentCustomer.customer.name;
                    }
                }
            }

            showCompletionModal(customerName) {
                const modal = document.getElementById('completionModal');
                const nameEl = document.getElementById('completedCustomerName');

                if (modal && nameEl) {
                    nameEl.textContent = `${customerName}'s ride completed!`;

                    const modalInstance = new bootstrap.Modal(modal);
                    modalInstance.show();

                    // Auto-hide after 2 seconds
                    setTimeout(() => modalInstance.hide(), 2000);
                }
            }

            showNotification(message, type = 'info') {
                console.log(`${type.toUpperCase()}: ${message}`);
                // You could integrate with a toast library here
            }

            handleEmergency() {
                alert('Emergency assistance requested! Sales staff have been notified.');
            }

            clearNotifications() {
                console.log('Notifications cleared');
            }

            updateLastUpdated() {
                const lastUpdatedEl = document.getElementById('lastUpdated');
                if (lastUpdatedEl) {
                    lastUpdatedEl.textContent = new Date().toLocaleTimeString();
                }
            }

            async loadStats() {
                try {
                    const response = await fetch(`${API_BASE}/stats`);
                    const result = await response.json();

                    if (result.success) {
                        ridesCompleted = result.data.completedRides || 0;
                        const ridesCompletedEl = document.getElementById('ridesCompleted');
                        if (ridesCompletedEl) {
                            ridesCompletedEl.textContent = ridesCompleted;
                        }
                    }
                } catch (error) {
                    console.error('Error loading stats:', error);
                }
            }

            updateConnectionStatus(status) {
                connectionStatus = status;
                const statusEl = document.getElementById('connectionStatusText');

                if (statusEl) {
                    switch (status) {
                        case 'connected':
                            statusEl.textContent = 'Connected';
                            statusEl.className = 'text-success';
                            break;
                        case 'connecting':
                            statusEl.textContent = 'Connecting...';
                            statusEl.className = 'text-warning';
                            break;
                        case 'disconnected':
                            statusEl.textContent = 'Disconnected';
                            statusEl.className = 'text-danger';
                            break;
                    }
                }
            }

            setupEventBroadcasting() {
                // Listen for storage events from other windows/tabs
                window.addEventListener('storage', (event) => {
                    if (event.key === 'driftride_event') {
                        const eventData = JSON.parse(event.newValue);
                        this.handleBroadcastEvent(eventData);
                    }
                });
            }

            broadcastEvent(type, data = {}) {
                const eventData = {
                    type: type,
                    timestamp: new Date().toISOString(),
                    source: 'driver-dashboard',
                    data: data
                };

                // Use localStorage to broadcast to other windows/tabs
                localStorage.setItem('driftride_event', JSON.stringify(eventData));

                // Clear the event after a short delay to trigger storage event
                setTimeout(() => {
                    localStorage.removeItem('driftride_event');
                }, 100);
            }

            handleBroadcastEvent(eventData) {
                console.log('Received broadcast event:', eventData);
                // Driver dashboard could respond to events from sales dashboard here
                // For now, we'll just refresh data on relevant events
                if (eventData.type === 'queue_updated' || eventData.type === 'track_mode_changed') {
                    this.loadDashboardData();
                }
            }

            async refreshDashboard() {
                console.log('Refreshing dashboard...');
                this.updateConnectionStatus('connecting');
                await this.loadDashboardData();
                this.updateLastUpdated();
                this.showNotification('Dashboard refreshed', 'success');
            }

            startAutoRefresh() {
                setInterval(async () => {
                    this.updateLastUpdated();

                    // Update data every 30 seconds
                    await this.loadDashboardData();
                }, 30000);
            }
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', function() {
            const dashboard = new DriverDashboardDemo();
            dashboard.initialize();
        });
    </script>
</body>
</html>
